<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruta de Edificios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card bg-secondary text-light shadow">
          <div class="card-header">
            <h4 class="mb-0">Trazado de Ruta entre Edificios</h4>
          </div>
          <div class="card-body">

            <form id="rutaForm">
              <!-- Primer desplegable -->
              <div class="mb-3">
                <label for="selectOrigen" class="form-label">Edificio de Origen</label>
                <select id="selectOrigen" class="form-select" required>
                  <option value="" selected disabled>Selecciona origen...</option>
                </select>
              </div>

              <!-- Segundo desplegable  -->
              <div class="mb-3">
                <label for="selectDestino" class="form-label">Edificio de Destino</label>
                <select id="selectDestino" class="form-select" required disabled>
                  <option value="" selected disabled>Primero elige un origen...</option>
                </select>
              </div>

              <button type="submit" id="btnGenerar" class="btn btn-primary w-100">
                Generar Mapa con Ruta
              </button>
            </form>

            <!-- Alerta de estado  -->
            <div id="alerta" class="alert alert-danger mt-3 d-none" role="alert"></div>

            <!-- Contenedor de la imagen devuelta por la API -->
            <div id="resultadoContainer" class="mt-4 text-center d-none">
              <h6 class="mb-2">Mapa generado:</h6>
              <img id="imagenMapa" src="" alt="Mapa con ruta" class="img-fluid rounded border border-light">
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    //
    const EDIFICIOS = ["T", "C", "M", "P", "B", "casino"];

    // URL de tu endpoint en Python (ajusta el puerto o ruta según tu backend)  **Importante**
    const API_URL = "http://127.0.0.1:8000/generar-ruta";

    const selectOrigen = document.getElementById("selectOrigen");
    const selectDestino = document.getElementById("selectDestino");
    const rutaForm = document.getElementById("rutaForm");
    const imagenMapa = document.getElementById("imagenMapa");
    const resultadoContainer = document.getElementById("resultadoContainer");
    const alerta = document.getElementById("alerta");
    const btnGenerar = document.getElementById("btnGenerar");

    // Llenar el primer desplegable al cargar
    function cargarOrigenes() {
      EDIFICIOS.forEach(edificio => {
        const option = document.createElement("option");
        option.value = edificio;
        option.textContent = edificio;
        selectOrigen.appendChild(option);
      });
    }

    // Actualizar el segundo desplegable excluyendo lo elegido en el primero
    selectOrigen.addEventListener("change", () => {
      const origenSeleccionado = selectOrigen.value;
      const destinoPrevio = selectDestino.value;

      // Limpiar opciones anteriores
      selectDestino.innerHTML = '<option value="" selected disabled>Selecciona destino...</option>';

      // Filtrar para quitar la opción elegida en origen
      const disponibles = EDIFICIOS.filter(e => e !== origenSeleccionado);

      disponibles.forEach(edificio => {
        const option = document.createElement("option");
        option.value = edificio;
        option.textContent = edificio;
        selectDestino.appendChild(option);
      });

      selectDestino.disabled = false;

      // Si el destino que ya había elegido sigue siendo válido, mantenerlo
      if (disponibles.includes(destinoPrevio)) {
        selectDestino.value = destinoPrevio;
      }
    });

    // Enviar datos a la API y mostrar la imagen con las líneas
    rutaForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      alerta.classList.add("d-none");
      btnGenerar.disabled = true;
      btnGenerar.textContent = "Generando ruta...";

      const origen = selectOrigen.value;
      const destino = selectDestino.value;

      try {
        // Opción A: Petición GET con query params (?origen=T&destino=casino)
        // Si tu API usa POST con JSON, avísame y lo cambiamos en 2 líneas
        const urlConParams = `${API_URL}?origen=${encodeURIComponent(origen)}&destino=${encodeURIComponent(destino)}`;
        const response = await fetch(urlConParams);

        if (!response.ok) {
          throw new Error(`Error del servidor: ${response.status}`);
        }

        const contentType = response.headers.get("content-type");

        if (contentType && contentType.includes("application/json")) {
          // Si tu API responde JSON: { "imagen_url": "..." } o { "imagen_base64": "..." }
          const data = await response.json();
          imagenMapa.src = data.imagen_url || `data:image/png;base64,${data.imagen_base64}`;
        } else {
          // Si tu API responde directamente con la imagen (StreamingResponse / FileResponse)
          const blob = await response.blob();
          imagenMapa.src = URL.createObjectURL(blob);
        }

        resultadoContainer.classList.remove("d-none");

      } catch (error) {
        alerta.textContent = `No se pudo conectar con la API: ${error.message}`;
        alerta.classList.remove("d-none");
      } finally {
        btnGenerar.disabled = false;
        btnGenerar.textContent = "Generar Mapa con Ruta";
      }
    });

    cargarOrigenes();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
