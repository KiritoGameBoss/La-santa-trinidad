<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutas Campus - Hackatón</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .mapa-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 720px;
    }
    .mapa-wrapper img,
    .mapa-wrapper canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0.375rem;
    }
    .mapa-wrapper canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    /* Switch circular más marcado */
    .form-switch .form-check-input {
      width: 3rem;
      height: 1.5rem;
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-dark text-light">

  <div class="container py-4">
    <div class="row g-4">

      <!-- Panel de controles -->
      <div class="col-md-5">
        <div class="card bg-secondary text-light shadow">
          <div class="card-header">
            <h5 class="mb-0">Configuración de Ruta</h5>
          </div>
          <div class="card-body">
            <form id="rutaForm">

              <!-- Desplegable Origen -->
              <div class="mb-3">
                <label for="selectOrigen" class="form-label">Origen</label>
                <select id="selectOrigen" class="form-select" required>
                  <option value="" selected disabled>Selecciona origen...</option>
                </select>
              </div>

              <!-- Desplegable Destino -->
              <div class="mb-3">
                <label for="selectDestino" class="form-label">Destino</label>
                <select id="selectDestino" class="form-select" required disabled>
                  <option value="" selected disabled>Primero elige un origen...</option>
                </select>
              </div>

              <!-- Botón circular / switch para ruta azul (para discapacitados) -->
              <div class="mb-4 p-3 rounded bg-dark border border-info">
                <div class="form-check form-switch d-flex align-items-center justify-content-between ps-0">
                  <label class="form-check-label fw-semibold text-info" for="switchDiscapacitados">
                    Priorizar ruta azul (para discapacitados)
                  </label>
                  <input class="form-check-input ms-2" type="checkbox" role="switch" id="switchDiscapacitados">
                </div>
                <small id="textoModoRuta" class="text-light-50 d-block mt-1">
                  Modo actual: Ruta general
                </small>
              </div>

              <!-- Botón Generar Mapa -->
              <button type="submit" id="btnGenerarMapa" class="btn btn-primary w-100 mb-2">
                Generar Mapa
              </button>

              <!-- Botón Invertir Ruta (activo al ya haber generado una ruta) -->
              <button type="button" id="btnInvertirRuta" class="btn btn-outline-warning w-100" disabled>
                Invertir Ruta
              </button>

            </form>

            <div id="estadoRuta" class="alert alert-info mt-3 d-none py-2 small"></div>
          </div>
        </div>
      </div>

      <!-- Mapa base + marcadores + líneas -->
      <div class="col-md-7 text-center">
        <div class="mapa-wrapper border border-light rounded shadow">
          <img id="imagenMapaBase" src="mapa_base.png" alt="Mapa del campus">
          <canvas id="canvasMapa"></canvas>
        </div>
      </div>

    </div>
  </div>

  <script>
    const EDIFICIOS = ["T", "C", "M", "P", "B", "casino"];

    // Coordenadas relativas (0 a 1) sobre tu imagen base; ajústalas a tu plano
    const COORDENADAS_EDIFICIOS = {
      "T":      { x: 0.16, y: 0.25 },
      "C":      { x: 0.34, y: 0.22 },
      "M":      { x: 0.52, y: 0.36 },
      "P":      { x: 0.72, y: 0.28 },
      "B":      { x: 0.42, y: 0.66 },
      "casino": { x: 0.68, y: 0.72 }
    };

    const selectOrigen = document.getElementById("selectOrigen");
    const selectDestino = document.getElementById("selectDestino");
    const switchDiscapacitados = document.getElementById("switchDiscapacitados");
    const textoModoRuta = document.getElementById("textoModoRuta");
    const btnInvertirRuta = document.getElementById("btnInvertirRuta");
    const rutaForm = document.getElementById("rutaForm");
    const estadoRuta = document.getElementById("estadoRuta");
    const imagenMapaBase = document.getElementById("imagenMapaBase");
    const canvas = document.getElementById("canvasMapa");
    const ctx = canvas.getContext("2d");

    let rutaGenerada = false;

    function ajustarCanvas() {
      canvas.width = imagenMapaBase.clientWidth;
      canvas.height = imagenMapaBase.clientHeight;
      FUNCION_PARA_VER_UBICACION();
      if (rutaGenerada) {
        dibujarRuta();
      }
    }

    function obtenerPixel(edificio) {
      const coord = COORDENADAS_EDIFICIOS[edificio];
      if (!coord) return null;
      return {
        x: coord.x * canvas.width,
        y: coord.y * canvas.height
      };
    }

    // =========================================================
    // FUNCION PARA VER UBICACION
    // Muestra en el mapa los lugares seleccionados actualmente
    // =========================================================
    function FUNCION_PARA_VER_UBICACION() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const puntos = [
        { codigo: selectOrigen.value, rol: "Origen", color: "#0dcaf0" },
        { codigo: selectDestino.value, rol: "Destino", color: "#ffc107" }
      ].filter(p => p.codigo);

      puntos.forEach(({ codigo, rol, color }) => {
        const pt = obtenerPixel(codigo);
        if (!pt) return;

        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#000000";
        ctx.stroke();

        ctx.font = "bold 13px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 3;
        const label = `${codigo} (${rol})`;
        ctx.strokeText(label, pt.x + 14, pt.y + 4);
        ctx.fillText(label, pt.x + 14, pt.y + 4);
      });
    }

    // Dibuja la línea según si está activa la prioridad de ruta azul (discapacitados)
    function dibujarRuta() {
      const p1 = obtenerPixel(selectOrigen.value);
      const p2 = obtenerPixel(selectDestino.value);
      if (!p1 || !p2) return;

      const usarRutaAzul = switchDiscapacitados.checked;

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = usarRutaAzul ? "#0d6efd" : "#ff2e63";
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    function poblarSelects(origenVal = "", destinoVal = "") {
      selectOrigen.innerHTML = '<option value="" disabled>Selecciona origen...</option>';
      EDIFICIOS.forEach(ed => {
        const opt = document.createElement("option");
        opt.value = ed;
        opt.textContent = ed;
        if (ed === origenVal) opt.selected = true;
        selectOrigen.appendChild(opt);
      });
      if (!origenVal) selectOrigen.selectedIndex = 0;

      if (origenVal) {
        const disponibles = EDIFICIOS.filter(ed => ed !== origenVal);
        selectDestino.innerHTML = '<option value="" disabled>Selecciona destino...</option>';
        disponibles.forEach(ed => {
          const opt = document.createElement("option");
          opt.value = ed;
          opt.textContent = ed;
          if (ed === destinoVal) opt.selected = true;
          selectDestino.appendChild(opt);
        });
        selectDestino.disabled = false;
        if (!destinoVal || !disponibles.includes(destinoVal)) {
          selectDestino.selectedIndex = 0;
        }
      } else {
        selectDestino.innerHTML = '<option value="" selected disabled>Primero elige un origen...</option>';
        selectDestino.disabled = true;
      }
    }

    function actualizarTextoModo() {
      textoModoRuta.textContent = switchDiscapacitados.checked
        ? "Modo actual: Priorizando ruta azul (para discapacitados)"
        : "Modo actual: Ruta estándar";
    }

    function generarMapaActual() {
      if (!selectOrigen.value || !selectDestino.value) return;
      rutaGenerada = true;
      btnInvertirRuta.disabled = false;

      FUNCION_PARA_VER_UBICACION();
      dibujarRuta();

      const modoTexto = switchDiscapacitados.checked
        ? "con prioridad ruta azul (discapacitados)"
        : "estándar";

      estadoRuta.textContent = `Mapa generado: ${selectOrigen.value} → ${selectDestino.value} (${modoTexto}).`;
      estadoRuta.classList.remove("d-none");
    }

    selectOrigen.addEventListener("change", () => {
      rutaGenerada = false;
      btnInvertirRuta.disabled = true;
      poblarSelects(selectOrigen.value, selectDestino.value);
      FUNCION_PARA_VER_UBICACION();
    });

    selectDestino.addEventListener("change", () => {
      rutaGenerada = false;
      btnInvertirRuta.disabled = true;
      FUNCION_PARA_VER_UBICACION();
    });

    switchDiscapacitados.addEventListener("change", () => {
      actualizarTextoModo();
      if (rutaGenerada) {
        generarMapaActual();
      }
    });

    rutaForm.addEventListener("submit", (e) => {
      e.preventDefault();
      generarMapaActual();
    });

    // Invierte origen y destino cuando ya se generó una ruta
    btnInvertirRuta.addEventListener("click", () => {
      if (!rutaGenerada || !selectOrigen.value || !selectDestino.value) return;

      const origenAnterior = selectOrigen.value;
      const destinoAnterior = selectDestino.value;

      poblarSelects(destinoAnterior, origenAnterior);
      generarMapaActual();
    });

    imagenMapaBase.addEventListener("load", ajustarCanvas);
    window.addEventListener("resize", ajustarCanvas);

    poblarSelects();
    actualizarTextoModo();
    if (imagenMapaBase.complete) {
      ajustarCanvas();
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
