<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Edificios - Hackatón</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .mapa-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 700px;
    }
    .mapa-wrapper img,
    .mapa-wrapper canvas {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0.375rem;
    }
    .mapa-wrapper canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-dark text-light">

  <div class="container py-4">
    <div class="row g-4">

      <!-- Controles -->
      <div class="col-md-5">
        <div class="card bg-secondary text-light shadow">
          <div class="card-header">
            <h5 class="mb-0">Selección de Edificios</h5>
          </div>
          <div class="card-body">
            <form id="mapaForm">
              <div class="mb-3">
                <label for="selectOrigen" class="form-label">Origen</label>
                <select id="selectOrigen" class="form-select" required>
                  <option value="" selected disabled>Selecciona origen...</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="selectDestino" class="form-label">Destino</label>
                <select id="selectDestino" class="form-select" required disabled>
                  <option value="" selected disabled>Primero elige un origen...</option>
                </select>
              </div>

              <button type="submit" id="btnGenerarMapa" class="btn btn-primary w-100">
                Generar Mapa
              </button>
            </form>

            <div id="mensajeEstado" class="alert alert-info mt-3 d-none py-2 small"></div>
          </div>
        </div>
      </div>

      <!-- Mapa base + marcadores + líneas -->
      <div class="col-md-7 text-center">
        <div class="mapa-wrapper border border-light rounded shadow">
          <!-- Imagen del mapa normal visible desde el inicio -->
          <img id="imagenMapaBase" src="mapa_base.png" alt="Mapa base">
          <!-- Canvas superpuesto para ubicaciones y líneas -->
          <canvas id="canvasMapa"></canvas>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Edificios disponibles (ajusta las coordenadas X e Y en porcentaje según tu imagen)
    const EDIFICIOS = ["T", "C", "M", "P", "B", "casino"];

    const COORDENADAS_EDIFICIOS = {
      "T":      { x: 0.15, y: 0.25 },
      "C":      { x: 0.35, y: 0.20 },
      "M":      { x: 0.55, y: 0.35 },
      "P":      { x: 0.75, y: 0.30 },
      "B":      { x: 0.40, y: 0.65 },
      "casino": { x: 0.70, y: 0.70 }
    };

    const selectOrigen = document.getElementById("selectOrigen");
    const selectDestino = document.getElementById("selectDestino");
    const mapaForm = document.getElementById("mapaForm");
    const imagenMapaBase = document.getElementById("imagenMapaBase");
    const canvas = document.getElementById("canvasMapa");
    const ctx = canvas.getContext("2d");
    const mensajeEstado = document.getElementById("mensajeEstado");

    let rutaGenerada = false;

    // Sincronizar tamaño interno del canvas con la imagen mostrada
    function ajustarCanvas() {
      canvas.width = imagenMapaBase.clientWidth;
      canvas.height = imagenMapaBase.clientHeight;
      FUNCION_PARA_VER_UBICACION();
      if (rutaGenerada) {
        dibujarLineasRuta();
      }
    }

    function obtenerPixel(edificio) {
      const coord = COORDENADAS_EDIFICIOS[edificio];
      if (!coord) return null;
      return {
        x: coord.x * canvas.width,
        y: coord.y * canvas.height
      };
    }

    // =========================================================
    // FUNCION PARA VER UBICACION
    // Idea: mostrar en el mapa los lugares seleccionados actualmente
    // =========================================================
    function FUNCION_PARA_VER_UBICACION() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const seleccionados = [
        { codigo: selectOrigen.value, etiqueta: "Origen", color: "#0dcaf0" },
        { codigo: selectDestino.value, etiqueta: "Destino", color: "#ffc107" }
      ].filter(item => item.codigo);

      seleccionados.forEach(({ codigo, etiqueta, color }) => {
        const pt = obtenerPixel(codigo);
        if (!pt) return;

        // Círculo de ubicación
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#000000";
        ctx.stroke();

        // Etiqueta del edificio
        ctx.font = "bold 13px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 3;
        const texto = `${codigo} (${etiqueta})`;
        ctx.strokeText(texto, pt.x + 14, pt.y + 4);
        ctx.fillText(texto, pt.x + 14, pt.y + 4);
      });
    }

    // Dibuja las líneas que entrega el programa entre origen y destino
    function dibujarLineasRuta() {
      const origen = selectOrigen.value;
      const destino = selectDestino.value;
      const p1 = obtenerPixel(origen);
      const p2 = obtenerPixel(destino);

      if (!p1 || !p2) return;

      // Aquí puedes conectar la lógica de rutas/caminos de tu programa
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.strokeStyle = "#ff2e63";
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    function cargarOrigenes() {
      EDIFICIOS.forEach(edificio => {
        const option = document.createElement("option");
        option.value = edificio;
        option.textContent = edificio;
        selectOrigen.appendChild(option);
      });
    }

    selectOrigen.addEventListener("change", () => {
      const origenSeleccionado = selectOrigen.value;
      const destinoPrevio = selectDestino.value;
      rutaGenerada = false;

      selectDestino.innerHTML = '<option value="" selected disabled>Selecciona destino...</option>';
      const disponibles = EDIFICIOS.filter(e => e !== origenSeleccionado);

      disponibles.forEach(edificio => {
        const option = document.createElement("option");
        option.value = edificio;
        option.textContent = edificio;
        selectDestino.appendChild(option);
      });

      selectDestino.disabled = false;

      if (disponibles.includes(destinoPrevio)) {
        selectDestino.value = destinoPrevio;
      }

      FUNCION_PARA_VER_UBICACION();
    });

    selectDestino.addEventListener("change", () => {
      rutaGenerada = false;
      FUNCION_PARA_VER_UBICACION();
    });

    mapaForm.addEventListener("submit", (e) => {
      e.preventDefault();
      rutaGenerada = true;
      FUNCION_PARA_VER_UBICACION();
      dibujarLineasRuta();

      mensajeEstado.textContent = `Ruta generada de "${selectOrigen.value}" a "${selectDestino.value}".`;
      mensajeEstado.classList.remove("d-none");
    });

    imagenMapaBase.addEventListener("load", ajustarCanvas);
    window.addEventListener("resize", ajustarCanvas);

    cargarOrigenes();
    if (imagenMapaBase.complete) {
      ajustarCanvas();
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
