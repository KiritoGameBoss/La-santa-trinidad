<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rutas Campus - Hackatón</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    #mapaFrame { width: 100%; height: 600px; border: 0; border-radius: .375rem; background: #fff; }
    .form-switch .form-check-input { width: 3rem; height: 1.5rem; cursor: pointer; }
  </style>
</head>
<body class="bg-dark text-light">
  <div class="container py-4">
    <div class="row g-4">

      <div class="col-md-5">
        <div class="card bg-secondary text-light shadow">
          <div class="card-header"><h5 class="mb-0">Configuración de Ruta</h5></div>
          <div class="card-body">
            <form id="rutaForm">
              <div class="mb-3">
                <label for="selectOrigen" class="form-label">Origen</label>
                <select id="selectOrigen" class="form-select" required>
                  <option value="" selected disabled>Selecciona origen...</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="selectDestino" class="form-label">Destino</label>
                <select id="selectDestino" class="form-select" required disabled>
                  <option value="" selected disabled>Primero elige un origen...</option>
                </select>
              </div>

              <div class="mb-4 p-3 rounded bg-dark border border-info">
                <div class="form-check form-switch d-flex align-items-center justify-content-between ps-0">
                  <label class="form-check-label fw-semibold text-info" for="switchDiscapacitados">
                    Movilidad reducida (solo rutas accesibles)
                  </label>
                  <input class="form-check-input ms-2" type="checkbox" role="switch" id="switchDiscapacitados">
                </div>
                <small id="textoModoRuta" class="d-block mt-1">Modo actual: Ruta estándar</small>
              </div>

              <button type="submit" class="btn btn-primary w-100 mb-2">Generar Mapa</button>
              <button type="button" id="btnInvertirRuta" class="btn btn-outline-warning w-100" disabled>
                Invertir Ruta
              </button>
            </form>

            <div id="estadoRuta" class="alert alert-info mt-3 d-none py-2 small"></div>
          </div>
        </div>
      </div>

      <div class="col-md-7">
        <iframe id="mapaFrame" src="/mapa"></iframe>
      </div>

    </div>
  </div>

  <script>
    let EDIFICIOS = [];
    let rutaGenerada = false;

    const selectOrigen = document.getElementById("selectOrigen");
    const selectDestino = document.getElementById("selectDestino");
    const switchDiscapacitados = document.getElementById("switchDiscapacitados");
    const textoModoRuta = document.getElementById("textoModoRuta");
    const btnInvertirRuta = document.getElementById("btnInvertirRuta");
    const rutaForm = document.getElementById("rutaForm");
    const estadoRuta = document.getElementById("estadoRuta");
    const mapaFrame = document.getElementById("mapaFrame");

    function poblarSelects(origenVal = "", destinoVal = "") {
      selectOrigen.innerHTML = '<option value="" disabled>Selecciona origen...</option>';
      EDIFICIOS.forEach(ed => {
        const opt = document.createElement("option");
        opt.value = ed; opt.textContent = ed;
        if (ed === origenVal) opt.selected = true;
        selectOrigen.appendChild(opt);
      });
      if (!origenVal) selectOrigen.selectedIndex = 0;

      if (origenVal) {
        const disponibles = EDIFICIOS.filter(ed => ed !== origenVal);
        selectDestino.innerHTML = '<option value="" disabled>Selecciona destino...</option>';
        disponibles.forEach(ed => {
          const opt = document.createElement("option");
          opt.value = ed; opt.textContent = ed;
          if (ed === destinoVal) opt.selected = true;
          selectDestino.appendChild(opt);
        });
        selectDestino.disabled = false;
        if (!destinoVal || !disponibles.includes(destinoVal)) selectDestino.selectedIndex = 0;
      } else {
        selectDestino.innerHTML = '<option value="" selected disabled>Primero elige un origen...</option>';
        selectDestino.disabled = true;
      }
    }

    function actualizarTextoModo() {
      textoModoRuta.textContent = switchDiscapacitados.checked
        ? "Modo actual: Movilidad reducida (tramos azules y morados)"
        : "Modo actual: Ruta estándar";
    }

    function mostrarEstado(html, tipo) {
      estadoRuta.className = `alert alert-${tipo} mt-3 py-2 small`;
      estadoRuta.innerHTML = html;
    }

    async function generarMapaActual() {
      const origen = selectOrigen.value;
      const destino = selectDestino.value;
      if (!origen || !destino) return;

      const params = new URLSearchParams({
        origen, destino,
        discapacitado: switchDiscapacitados.checked ? "1" : "0"
      });

      try {
        const resp = await fetch(`/api/ruta?${params}`);
        const data = await resp.json();

        if (!data.ok) {
          mostrarEstado(data.error, "danger");
          return;
        }

        rutaGenerada = true;
        btnInvertirRuta.disabled = false;
        mapaFrame.src = `/mapa?${params}`;   // el servidor dibuja la ruta

        let html = `<strong>${origen} → ${destino}</strong>: ${data.metros} m, ~${data.minutos} min a pie`;
        if (data.con_apoyo) {
          html += `<br><strong>⚠ Esta ruta incluye tramos que requieren apoyo extra.</strong>`;
        }
        html += `<ol class="mb-0 mt-2">` +
          data.pasos.slice(2, -1)
            .filter(p => /^\d+\./.test(p))
            .map(p => `<li>${p.replace(/^\d+\.\s*/, "")}</li>`).join("") +
          `</ol>`;
        mostrarEstado(html, data.con_apoyo ? "warning" : "success");
      } catch (err) {
        mostrarEstado("No se pudo conectar con el servidor.", "danger");
      }
    }

    selectOrigen.addEventListener("change", () => {
      rutaGenerada = false;
      btnInvertirRuta.disabled = true;
      poblarSelects(selectOrigen.value, selectDestino.value);
    });

    selectDestino.addEventListener("change", () => {
      rutaGenerada = false;
      btnInvertirRuta.disabled = true;
    });

    switchDiscapacitados.addEventListener("change", () => {
      actualizarTextoModo();
      if (rutaGenerada) generarMapaActual();
    });

    rutaForm.addEventListener("submit", e => {
      e.preventDefault();
      generarMapaActual();
    });

    btnInvertirRuta.addEventListener("click", () => {
      if (!rutaGenerada) return;
      const o = selectOrigen.value, d = selectDestino.value;
      poblarSelects(d, o);
      generarMapaActual();
    });

    // Al cargar: pedir la lista de edificios al servidor
    (async () => {
      EDIFICIOS = await (await fetch("/api/edificios")).json();
      poblarSelects();
      actualizarTextoModo();
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
